plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.wakeupassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.wakeupassistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Prevent TFLite model files from being compressed in the APK
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    // ── AndroidX ─────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'

    // ── Kotlin Coroutines (for Esp32Client suspend funs) ─────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── TensorFlow Lite ──────────────────────────────────────────────
    // Task Library – Audio (for YAMNet AudioClassifier)
    implementation 'org.tensorflow:tensorflow-lite-task-audio:0.4.4'

    // Core Interpreter (for YOLOv8 manual inference)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    // Optional: GPU delegate for faster inference (uncomment if needed)
    // implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'

    // ── CameraX (live preview + still capture) ───────────────────────
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
}
